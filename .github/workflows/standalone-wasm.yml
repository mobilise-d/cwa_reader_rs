name: Standalone browser WASM

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-reader:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v4
      - name: Build native comparison package from this checkout
        run: |
          uv venv --python 3.13 /tmp/cwa-browser-native
          uv pip install --python /tmp/cwa-browser-native/bin/python . pytest
          echo 'CWA_NATIVE_PYTHON=/tmp/cwa-browser-native/bin/python' >> "$GITHUB_ENV"
      - name: Install matching Wasm binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build browser bundle
        run: |
          cargo fmt --manifest-path wasm/Cargo.toml --check
          wasm/build.sh
      - name: Install browser test tools
        working-directory: wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compare browser File reads with native Python
        working-directory: wasm
        run: npm test
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: standalone-browser-wasm
          path: |
            wasm/pkg/
            wasm/example/
            wasm/Cargo.lock
            docs/standalone-wasm.md
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-browser-test-results
          path: |
            wasm/test-results/results.json
            wasm/test-results/header-metrics.json
            wasm/test-results/recording-metrics.json
