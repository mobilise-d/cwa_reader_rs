[package]
name = "cwa_reader_browser"
version = "0.5.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "=0.3.106"
cwa-core = { path = "../crates/cwa-core" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Blob", "FileReaderSync"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
